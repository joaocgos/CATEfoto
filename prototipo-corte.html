<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · corte automático</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f4f4; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 4px 0 12px; color: #555; font-size: 14px; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  button, label.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #E30A17; color: #fff; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; }
  button.sec { background: #ddd; color: #1a1a1a; }
  button:disabled { opacity: .4; }
  #estado { font-size: 14px; font-weight: 600; }
  .palco { position: relative; display: inline-block; max-width: 100%; touch-action: none; user-select: none; }
  .palco img { display: block; max-width: 100%; max-height: 70vh; }
  .palco svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .canto { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(227,10,23,.25); border: 3px solid #E30A17; touch-action: none; }
  #resultado { max-width: 100%; display: block; margin-top: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
</style>
</head>
<body>
<h1>Protótipo: corte automático de etiquetas e documentos</h1>
<p>Descartável. Tira uma fotografia, a app procura os 4 cantos, ajusta-os com o dedo se for preciso e carrega em Cortar.</p>
<div id="estado">A carregar o OpenCV…</div>

<div class="botoes">
  <label class="btn" id="tirar" hidden>Tirar fotografia
    <input id="ficheiro" type="file" accept="image/*" capture="environment" hidden>
  </label>
  <button id="cortar" disabled>Cortar</button>
  <button id="repor" class="sec" disabled>Repor cantos detetados</button>
</div>

<div class="palco" id="palco" hidden>
  <img id="foto" alt="Fotografia original">
  <svg id="contorno"><polygon fill="rgba(227,10,23,.12)" stroke="#E30A17" stroke-width="2"/></svg>
</div>

<canvas id="resultado" hidden></canvas>

<script>
const $ = (id) => document.getElementById(id);
const estado = (t) => { $("estado").textContent = t; };
let imagem = null;          // HTMLImageElement com a fotografia completa
let cantos = [];            // 4 pontos em píxeis da fotografia completa: [tl, tr, br, bl]
let detetados = [];
const DETECAO_MAX = 1000;   // a deteção corre numa cópia reduzida, por velocidade

// ── deteção ───────────────────────────────────────────────────────────────────
function ordenar(pts) {
  // canto superior esquerdo: menor x+y; inferior direito: maior x+y;
  // superior direito: menor y-x; inferior esquerdo: maior y-x.
  const s = pts.map((p) => p.x + p.y), d = pts.map((p) => p.y - p.x);
  const i = (arr, f) => arr.indexOf(f(...arr));
  return [pts[i(s, Math.min)], pts[i(d, Math.min)], pts[i(s, Math.max)], pts[i(d, Math.max)]];
}

function detetar(img) {
  const escala = Math.min(1, DETECAO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const cv_ = document.createElement("canvas");
  cv_.width = Math.round(img.naturalWidth * escala);
  cv_.height = Math.round(img.naturalHeight * escala);
  cv_.getContext("2d").drawImage(img, 0, 0, cv_.width, cv_.height);

  const src = cv.imread(cv_), cinz = new cv.Mat(), bordas = new cv.Mat();
  const contornos = new cv.MatVector(), hier = new cv.Mat();
  const nucleo = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
  let melhor = null, metodo = "nenhum";
  try {
    cv.cvtColor(src, cinz, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(cinz, cinz, new cv.Size(5, 5), 0);
    cv.Canny(cinz, bordas, 50, 150);
    cv.dilate(bordas, bordas, nucleo);   // fecha falhas pequenas no contorno
    cv.findContours(bordas, contornos, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    const areaMin = cv_.width * cv_.height * 0.08;
    let melhorArea = 0, maiorIdx = -1, maiorArea = 0;
    for (let k = 0; k < contornos.size(); k++) {
      const c = contornos.get(k);
      const area = cv.contourArea(c);
      if (area > maiorArea) { maiorArea = area; maiorIdx = k; }
      if (area > areaMin && area > melhorArea) {
        const aprox = new cv.Mat();
        cv.approxPolyDP(c, aprox, 0.02 * cv.arcLength(c, true), true);
        if (aprox.rows === 4 && cv.isContourConvex(aprox)) {
          melhorArea = area;
          melhor = [0, 1, 2, 3].map((j) => ({ x: aprox.data32S[j * 2], y: aprox.data32S[j * 2 + 1] }));
          metodo = "quadrilátero";
        }
        aprox.delete();
      }
      c.delete();
    }
    // Sem quadrilátero limpo: retângulo mínimo à volta do maior contorno.
    if (!melhor && maiorIdx >= 0 && maiorArea > areaMin) {
      const r = cv.minAreaRect(contornos.get(maiorIdx));
      melhor = cv.RotatedRect.points(r).map((p) => ({ x: p.x, y: p.y }));
      metodo = "retângulo aproximado";
    }
  } finally {
    [src, cinz, bordas, contornos, hier, nucleo].forEach((m) => m.delete());
  }
  if (!melhor) {
    const w = img.naturalWidth, h = img.naturalHeight, m = 0.05;
    return { pts: [{ x: w*m, y: h*m }, { x: w*(1-m), y: h*m }, { x: w*(1-m), y: h*(1-m) }, { x: w*m, y: h*(1-m) }], metodo };
  }
  return { pts: ordenar(melhor.map((p) => ({ x: p.x / escala, y: p.y / escala }))), metodo };
}

// ── corte com correção de perspetiva ─────────────────────────────────────────
function cortar() {
  const [tl, tr, br, bl] = cantos;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const w = Math.round(Math.max(dist(tl, tr), dist(bl, br)));
  const h = Math.round(Math.max(dist(tl, bl), dist(tr, br)));
  // cv.imread(<img>) lê ao tamanho mostrado no ecrã; passar por um canvas
  // ao tamanho real para os cantos (em píxeis reais) baterem certo.
  const tela = document.createElement("canvas");
  tela.width = imagem.naturalWidth; tela.height = imagem.naturalHeight;
  tela.getContext("2d").drawImage(imagem, 0, 0);
  const src = cv.imread(tela), dst = new cv.Mat();
  const de = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
  const para = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h]);
  const M = cv.getPerspectiveTransform(de, para);
  try {
    cv.warpPerspective(src, dst, M, new cv.Size(w, h), cv.INTER_LINEAR, cv.BORDER_REPLICATE);
    cv.imshow($("resultado"), dst);
    $("resultado").hidden = false;
    estado(`Cortado: ${w} × ${h} px.`);
  } finally {
    [src, dst, de, para, M].forEach((m) => m.delete());
  }
}

// ── cantos arrastáveis ───────────────────────────────────────────────────────
const handles = [0, 1, 2, 3].map((i) => {
  const d = document.createElement("div");
  d.className = "canto";
  $("palco").appendChild(d);
  d.addEventListener("pointerdown", (e) => {
    d.setPointerCapture(e.pointerId);
    const mover = (ev) => {
      const r = $("foto").getBoundingClientRect(), k = imagem.naturalWidth / r.width;
      cantos[i] = {
        x: Math.min(Math.max(0, (ev.clientX - r.left) * k), imagem.naturalWidth),
        y: Math.min(Math.max(0, (ev.clientY - r.top) * k), imagem.naturalHeight),
      };
      desenhar();
    };
    d.addEventListener("pointermove", mover);
    d.addEventListener("pointerup", () => d.removeEventListener("pointermove", mover), { once: true });
  });
  return d;
});

function desenhar() {
  const r = $("foto").getBoundingClientRect(), k = r.width / imagem.naturalWidth;
  cantos.forEach((p, i) => { handles[i].style.left = p.x * k + "px"; handles[i].style.top = p.y * k + "px"; });
  $("contorno").querySelector("polygon").setAttribute("points", cantos.map((p) => `${p.x * k},${p.y * k}`).join(" "));
}
window.addEventListener("resize", () => imagem && desenhar());

// ── fluxo ────────────────────────────────────────────────────────────────────
function carregar(url) {
  const img = $("foto");
  img.onload = () => {
    imagem = img;
    $("palco").hidden = false;
    $("resultado").hidden = true;
    const t0 = performance.now();
    const { pts, metodo } = detetar(img);
    detetados = pts.map((p) => ({ ...p }));
    cantos = pts.map((p) => ({ ...p }));
    desenhar();
    $("cortar").disabled = $("repor").disabled = false;
    estado(`Deteção: ${metodo} em ${Math.round(performance.now() - t0)} ms. Ajusta os cantos se for preciso.`);
  };
  img.src = url;
}

$("ficheiro").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) carregar(URL.createObjectURL(f));
});
$("cortar").addEventListener("click", cortar);
$("repor").addEventListener("click", () => { cantos = detetados.map((p) => ({ ...p })); desenhar(); });

// Carrega o OpenCV.js (≈3 MB comprimido) e espera que o WebAssembly arranque.
const pronto = () => { estado("Pronto. Tira uma fotografia."); $("tirar").hidden = false; };
const s = document.createElement("script");
s.src = "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js";
s.onload = async () => {
  if (window.cv instanceof Promise) window.cv = await window.cv;
  if (window.cv.Mat) pronto(); else window.cv.onRuntimeInitialized = pronto;
};
s.onerror = () => estado("Não consegui carregar o OpenCV.");
document.body.appendChild(s);
</script>
</body>
</html>
